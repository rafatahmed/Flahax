[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "flahax"
version = "0.6.0"
description = "Fertilizer recipe, pH and acid plan and A/B stock tanks from a water analysis and a crop formula: an interactive command for growers and agronomists on a pure-Python nutrient-chemistry engine checked against PHREEQC."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICEN[CS]E*", "NOTICE"]
authors = [{ name = "Rafat A. Al Khashan", email = "rafat.khashan82@gmail.com" }]
maintainers = [
    { name = "Rafat A. Al Khashan", email = "rafat.khashan82@gmail.com" },
    { name = "Flaha Agri Tech" },
]
keywords = [
    "fertilizer", "fertigation", "hydroponics", "nutrient-solution", "plant-nutrition", "agronomy",
    "formulation", "stock-solution", "A/B-tanks", "pH", "acid-dosing", "water-analysis",
    "aqueous-chemistry", "equilibrium", "speciation", "PHREEQC",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/rafatahmed/Flahax"
Documentation = "https://flahax.readthedocs.io/"
Source = "https://github.com/rafatahmed/Flahax"
Issues = "https://github.com/rafatahmed/Flahax/issues"
Changelog = "https://github.com/rafatahmed/Flahax/blob/main/CHANGELOG.md"
Citation = "https://github.com/rafatahmed/Flahax/blob/main/CITATION.cff"
"Growers guide" = "https://flahax.readthedocs.io/en/latest/growers.html"

[project.scripts]
flahax = "flahax.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
flahax = ["data/*.json", "data/*.md"]

# Development style checks only (PEP 8, line length 99); not a runtime dependency.
# Run: ruff format . && ruff check .   (ruff 0.8.4, pinned in CI)
[tool.ruff]
line-length = 99
target-version = "py311"
extend-exclude = ["docs/site/_static", "docs/publication"]

[tool.ruff.format]
quote-style = "preserve"

[tool.ruff.lint]
preview = true
select = ["E", "W", "F"]
# Public classes, methods and functions of the package carry a docstring (pydocstyle D101-D103).
extend-select = ["D101", "D102", "D103"]

[tool.ruff.lint.per-file-ignores]
"!src/**" = ["D101", "D102", "D103"]
