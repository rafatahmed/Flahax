# Exact local raw-count gates precede the single combined native upload.
codecov:
  require_ci_to_pass: true
coverage:
  status:
    project:
      default:
        target: 100%
        threshold: 0%
        informational: false
    patch:
      default:
        target: 100%
        threshold: 0%
        informational: false
flags:
  unittests:
    carryforward: false
