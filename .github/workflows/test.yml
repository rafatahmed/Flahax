name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install ruff (development tool only)
        run: python -m pip install ruff==0.8.4
      - name: PEP 8 lint (settings in pyproject.toml)
        run: ruff check .
      - name: Formatting
        run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e . build
      - name: Unit tests
        if: matrix.python-version != '3.13'
        run: python -m unittest discover -s tests -t .
      - name: Unit tests with coverage (coverage is a CI tool only, not a dependency)
        if: matrix.python-version == '3.13'
        env:
          COVERAGE_FILE: build/.coverage
        run: |
          python -m pip install coverage==7.17.0
          mkdir -p build
          python -m coverage run --source=src/flahax -m unittest discover -s tests -t .
          python -m coverage xml -o build/coverage.xml
          python -m coverage report
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        if: matrix.python-version == '3.13'
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: build/coverage.xml
          flags: unittests
          fail_ci_if_error: false
      - name: Clean wheel and sdist verification
        run: python tools/verify_distribution.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: distribution-evidence-${{ matrix.python-version }}
          path: build/distribution-verification.json

  phreeqc-live:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install package
        run: python -m pip install .
      - name: Provision hash-pinned external PHREEQC
        shell: pwsh
        run: ./tools/provision_phreeqc.ps1
      - name: Required live reference replay and runtime equivalence
        shell: pwsh
        run: |
          python -m unittest tests.test_product_phreeqc tests.test_acid_reference -v 2>&1 | Tee-Object -FilePath phreeqc-validation.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: phreeqc-live-evidence
          path: phreeqc-validation.log

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install package and docs tooling
        run: python -m pip install . -r docs/site/requirements.txt
      - name: Build documentation (warnings are errors)
        run: python -m sphinx -W --keep-going -b html docs/site build/docs-html
