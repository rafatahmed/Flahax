name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e . build
      - name: Unit tests
        run: python -m unittest discover -s tests -t .
      - name: Clean wheel and sdist verification
        run: python tools/verify_distribution.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: distribution-evidence-${{ matrix.python-version }}
          path: build/distribution-verification.json

  phreeqc-live:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install package
        run: python -m pip install .
      - name: Provision hash-pinned external PHREEQC
        shell: pwsh
        run: ./tools/provision_phreeqc.ps1
      - name: Required live reference replay and runtime equivalence
        shell: pwsh
        run: |
          python -m unittest tests.test_product_phreeqc tests.test_acid_reference -v 2>&1 | Tee-Object -FilePath phreeqc-validation.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: phreeqc-live-evidence
          path: phreeqc-validation.log
